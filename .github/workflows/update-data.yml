name: Update dashboard data

on:
  schedule:
    # 每週一 01:00 UTC ≒ 台北時間 09:00
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch SITCA data and build dashboard
        id: build
        env:
          SITCA_RAW_DIR: raw_debug
        run: python scripts/build_dashboard.py

      - name: Upload raw fetch snapshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitca-raw-${{ github.run_id }}
          path: raw_debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: update fund dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
