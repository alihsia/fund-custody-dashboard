<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="商機捕手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>商機捕手：基金保管</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#16191f;--sub:#6b7280;--line:#e4e7ec;--chip:#eceff4;--navy:#1f3a5f;--red:#c8102e;--up:#0f8a4f;--down:#d0312d}
@media (prefers-color-scheme:dark){:root{--bg:#0e1014;--card:#191c22;--ink:#eef0f3;--sub:#99a1ad;--line:#2a2f38;--chip:#242932;--navy:#8fb3e0;--red:#ff5a6e;--up:#3ccf86;--down:#ff6b5e}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media (min-width:600px){body{padding:24px 0}.app{border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:860px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.12)}}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:12px;color:var(--sub);letter-spacing:.04em}
h1{font-size:21px;font-weight:700;margin-top:2px}
.psub{font-size:12.5px;color:var(--sub);margin-top:2px}
.fbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;position:relative;white-space:nowrap}
.fbtn svg{width:16px;height:16px}
.badge[hidden]{display:none}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.meta{display:inline-block;margin-top:6px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}

main{padding:14px 16px 8px}
.sec{margin-top:18px}.sec:first-child{margin-top:0}
.sh2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h2{font-size:16px;font-weight:700}
.msg{font-size:14px;color:var(--sub);margin-bottom:10px}
.msg b{color:var(--ink)}
.box{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;min-width:0}
.kl{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font-size:18px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.kd{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--up)!important}.down{color:var(--down)!important}

.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{padding:5px 11px;border-radius:8px;font-size:13px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.full{display:flex}.seg.full button{flex:1}

.hbr{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.hbf{height:100%;background:var(--navy);border-radius:5px;opacity:.55}
.hbf.hl{background:var(--red);opacity:1}
.hbf.mute{background:var(--sub);opacity:.3}
.hbv{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.vb{display:flex;align-items:flex-end;height:150px;gap:5px;padding-top:6px}
.vbc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbn{font-size:10.5px;color:var(--sub);margin-bottom:3px}
.vbf{width:100%;background:var(--navy);opacity:.35;border-radius:4px 4px 0 0;min-height:2px}
.vbf.hl{background:var(--red);opacity:1}
.vbc.hl .vbn{color:var(--red);font-weight:700}
.vbl{font-size:10.5px;color:var(--sub);margin-top:4px}

.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card:active{transform:scale(.99)}
.card.hl{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.rk{width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:13.5px;flex:none}
.rk.top{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.rk.top{color:#0e1014}}
.cm{flex:1;min-width:0}
.cn{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{text-align:right;flex:none}
.cv{font-weight:700;font-variant-numeric:tabular-nums}
.cd{font-size:12px;color:var(--sub);margin-top:1px}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--red);color:#fff;margin-left:6px;vertical-align:2px}
.more{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px dashed var(--line);color:var(--navy);font-weight:600;font-size:14px}
.pinlbl{font-size:12px;color:var(--sub);margin:12px 2px 6px}

details.exp{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details.exp summary{list-style:none;padding:12px 14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.exp summary::-webkit-details-marker{display:none}
details.exp summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:.2s;margin-right:4px}
details.exp[open] summary::after{transform:rotate(-135deg)}
details.exp .eb{padding:0 14px 14px;font-size:13.5px;color:var(--sub)}
details.exp .eb p+p{margin-top:6px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0e1014}}
.chip.x::after{content:" ✕";opacity:.7}
.picker{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-weight:650}
.picker span{color:var(--sub);font-size:12.5px;font-weight:500}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
@media (min-width:600px){nav{position:sticky;transform:none;left:auto}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;color:var(--sub);font-weight:600}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--red)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;max-height:86vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;z-index:50;transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 4px}
.shd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 12px;position:sticky;top:0;background:var(--card)}
.shd b{font-size:17px}
.shd button{width:30px;height:30px;border-radius:50%;background:var(--chip);font-size:13px;flex:none}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
.fld select,.fld input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;-webkit-appearance:none;appearance:none;min-height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.bp{padding:13px;border-radius:13px;background:var(--navy);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.bp{color:#0e1014}}
.bs{padding:13px;border-radius:13px;background:var(--chip);font-weight:700}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
.stat span{display:block;font-size:11.5px;color:var(--sub)}
.stat b{font-size:16px}
.fullname{font-size:13px;color:var(--sub);margin:-4px 0 12px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left}
.opt.on{color:var(--red);font-weight:700}
.opt.on::after{content:"✓"}
.opt small{color:var(--sub);font-weight:400}
.dl{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;margin-top:10px;color:var(--ink);text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px}
.foot{font-size:11px;color:var(--sub);padding:18px 2px 6px;line-height:1.6}
.foot a{color:var(--navy)}
.install{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px}
.install div{flex:1}
.install b{display:block;font-size:13.5px}
.install button{font-size:13px;font-weight:700;color:var(--navy)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--sub);font-size:14px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <div style="min-width:0">
        <div class="brand">商機捕手｜基金保管</div>
        <h1 id="ptitle">載入中</h1>
      </div>
      <button class="fbtn" id="fbtn" onclick="openFilter()" style="visibility:hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span id="flabel">篩選</span><span class="badge" id="fbadge" hidden></span>
      </button>
    </div>
    <div class="psub" id="psub"></div>
    <span class="meta" id="meta">讀取公會公開資料中…</span>
  </header>

  <main id="main"><div class="loading">讀取資料中…</div></main>

  <nav>
    <button class="tab" data-p="overview" onclick="go('overview')"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>總覽</button>
    <button class="tab" data-p="structure" onclick="go('structure')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 6"/></svg>結構</button>
    <button class="tab" data-p="newfunds" onclick="go('newfunds')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>新案</button>
    <button class="tab" data-p="relations" onclick="go('relations')"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="3"/><circle cx="18" cy="17" r="3"/><path d="M8.5 9l7 6"/></svg>往來</button>
    <button class="tab" data-p="lookup" onclick="go('lookup')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>查詢</button>
  </nav>
</div>

<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shd"><b id="stitle"></b><button onclick="closeSheet()" aria-label="關閉">✕</button></div>
  <div id="sbody"></div>
</div>

<script>
"use strict";
/* ========== 常數（與桌機版 logic.js 一致） ========== */
const BANK_SHORT={'中國信託商業銀行':'中國信託','第一商業銀行':'第一','彰化商業銀行':'彰化','永豐商業銀行':'永豐','玉山商業銀行':'玉山','華南商業銀行':'華南','兆豐國際商業銀行':'兆豐','合作金庫商業銀行':'合作金庫','臺灣銀行':'臺銀','臺灣中小企業銀行':'臺企銀','台北富邦商業銀行':'台北富邦','台新國際商業銀行':'台新','國泰世華商業銀行':'國泰世華','陽信商業銀行':'陽信','渣打國際商業銀行':'渣打','臺灣新光商業銀行':'臺灣新光','台中商業銀行':'台中','凱基商業銀行':'凱基','遠東國際商業銀行':'遠東','上海商業儲蓄銀行':'上海商銀','聯邦商業銀行':'聯邦','臺灣土地銀行':'土銀','元大商業銀行':'元大'};
const CATEGORY_ORDER=['被動式ETF','主動式ETF','一般債券型','股票型','指數型','非投資等級債券型','平衡型','多重資產型','貨幣市場型','組合型','其他'];
const DEFAULT_HERO='永豐';

/* ========== 工具 ========== */
const $=s=>document.querySelector(s);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fmtA=v=>v>=10000?(v/10000).toFixed(2)+" 兆":v>=10?Math.round(v).toLocaleString("en-US")+" 億":v.toFixed(1)+" 億";
const pct=(v,d=1)=>isFinite(v)?(v*100).toFixed(d)+"%":"–";
const esc=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const html=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sb=n=>BANK_SHORT[n]||n;
function cleanName(n){
  return n.replace(/[（(][^()（）]*(配息|本基金|風險|非投資等級|保本|不保證)[^()（）]*[)）]/g,"")
    .replace(/\s+/g,"").replace(/[-－]+$/,"").trim()||n}
function rankBy(list,key){const s=[...list].sort((a,b)=>b[key]-a[key]);let r=0,prev=null;return s.map((x,i)=>{if(x[key]!==prev){r=i+1;prev=x[key]}return Object.assign({},x,{rank:r})})}

/* ========== 狀態與資料 ========== */
let META,FUNDS,BL,BS,TOTAL,CUR,WIN_START,CUTOFF_MD,TRUSTS,BANKNAMES,RANKA={},RANKC={};
const S={page:"overview",metric:"aum",showAll:{},hero:DEFAULT_HERO,nm:"count",relMode:"trust",relTrust:"",relBank:DEFAULT_HERO,
  q:{trust:"",bank:"",cat:"",from:"",to:"",kw:""},qLimit:20};

function init(d){
  META=d.meta;
  FUNDS=d.funds.filter(f=>f.cu).map((f,i)=>({i,id:f.id,name:cleanName(f.n),full:f.n,trust:f.co||"（未知）",bank:sb(f.cu),bankFull:f.cu,cat:f.c,etf:f.e,date:f.inc||"",year:f.inc?+f.inc.slice(0,4):0,size:f.a/1e8,nc:f.nc}));
  CUR=Number(META.aumAsOf.slice(0,4));
  WIN_START=(CUR-2)+"-01-01";
  const curDates=FUNDS.filter(f=>f.year===CUR).map(f=>f.date).sort();
  CUTOFF_MD=(curDates.length?curDates[curDates.length-1]:META.aumAsOf).slice(5);
  BS={};
  FUNDS.forEach(f=>{const b=BS[f.bank]||(BS[f.bank]={name:f.bank,full:f.bankFull,aum:0,count:0,clients:new Set(),newC:0,newA:0,yC:0,trusts:{},cats:{}});
    b.aum+=f.size;b.count++;b.clients.add(f.trust);
    const t=b.trusts[f.trust]||(b.trusts[f.trust]={c:0,a:0});t.c++;t.a+=f.size;
    b.cats[f.cat]=(b.cats[f.cat]||0)+1;
    if(f.date>=WIN_START){b.newC++;b.newA+=f.size}
    if(f.year===CUR)b.yC++});
  BL=Object.values(BS);
  TOTAL={aum:sum(FUNDS,f=>f.size),count:FUNDS.length};
  rankBy(BL,"aum").forEach(b=>RANKA[b.name]=b.rank);
  rankBy(BL,"count").forEach(b=>RANKC[b.name]=b.rank);
  BANKNAMES=rankBy(BL,"aum").map(b=>b.name);
  const ta={};FUNDS.forEach(f=>ta[f.trust]=(ta[f.trust]||0)+f.size);
  TRUSTS=Object.keys(ta).sort((a,b)=>ta[b]-ta[a]);
  if(!BS[S.hero])S.hero=BANKNAMES[0];
  if(!BS[S.relBank])S.relBank=BANKNAMES[0];
  S.relTrust=TRUSTS[0];
  try{const h=localStorage.getItem("fcd_hero");if(h&&BS[h])S.hero=h}catch(e){}
  $("#meta").textContent=`資料月份 ${META.dataMonth}｜規模基準日 ${META.aumAsOf}｜更新 ${META.pageGenerated}`;
  const p=(location.hash||"").slice(1);if(PAGES[p])S.page=p;
  render();
}

/* ========== 元件 ========== */
const kpis=a=>`<div class="kpis">${a.map(k=>`<div class="kpi"><div class="kl">${k.l}</div><div class="kv">${k.v}</div>${k.d?`<div class="kd ${k.c||""}">${k.d}</div>`:""}</div>`).join("")}</div>`;
function hbars(rows,fmt){const max=Math.max(...rows.map(r=>r.v),1e-9);return rows.map(r=>`<div class="hbr"><div class="hbl">${html(r.l)}</div><div class="hbt"><div class="hbf ${r.hl?"hl":""} ${r.mute?"mute":""}" style="width:${Math.max(2,r.v/max*100)}%"></div></div><div class="hbv">${fmt(r.v)}</div></div>`).join("")}
function vbars(rows){const max=Math.max(...rows.map(r=>r.v),1);return `<div class="vb">${rows.map(r=>`<div class="vbc ${r.hl?"hl":""}"><div class="vbn">${r.v}</div><div class="vbf ${r.hl?"hl":""}" style="height:${r.v/max*100}%"></div><div class="vbl">${r.l}</div></div>`).join("")}</div>`}
const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S[k]===v?"on":""}" onclick="setS('${k}','${v}')">${l}</button>`).join("")}</div>`;
const card=it=>`<button class="card ${it.hl?"hl":""}" onclick="${it.on||""}"><div class="rk ${it.rank<=3?"top":""}">${it.rank}</div><div class="cm"><div class="cn">${html(it.name)}${it.tag?`<span class="tag">${it.tag}</span>`:""}</div><div class="cs">${html(it.sub)}</div></div><div class="cr"><div class="cv">${it.val}</div><div class="cd ${it.cls||""}">${it.delta||""}</div></div></button>`;
function cards(id,items,limit=5,pin){
  const all=S.showAll[id],shown=all?items:items.slice(0,limit);let h=`<div class="list">${shown.map(card).join("")}</div>`;
  if(pin&&!all){const p=items.find(x=>x.name===pin);if(p&&!shown.includes(p))h+=`<div class="pinlbl">本行位置</div><div class="list">${card(p)}</div>`}
  if(items.length>limit)h+=`<button class="more" onclick="toggleAll('${id}')">${all?`收合，只看前 ${limit} 名`:`顯示全部 ${items.length} ${id.startsWith("relbank")?"家投信":"家"}`}</button>`;
  return h}

/* ========== 查詢 ========== */
function filtered(){const q=S.q,kw=q.kw.trim();return FUNDS.filter(f=>(!q.trust||f.trust===q.trust)&&(!q.bank||f.bank===q.bank)&&(!q.cat||f.cat===q.cat)&&(!q.from||f.date>=q.from)&&(!q.to||f.date<=q.to)&&(!kw||f.full.includes(kw))).sort((a,b)=>b.size-a.size)}
function activeChips(){const q=S.q,a=[];if(q.trust)a.push(["trust",q.trust]);if(q.bank)a.push(["bank",q.bank]);if(q.cat)a.push(["cat",q.cat]);if(q.from)a.push(["from",q.from+" 起"]);if(q.to)a.push(["to","至 "+q.to]);if(q.kw)a.push(["kw","「"+q.kw+"」"]);return a}
function rmQ(k){S.q[k]="";S.qLimit=20;render()}
function clearQ(){S.q={trust:"",bank:"",cat:"",from:"",to:"",kw:""};S.qLimit=20;render()}
function qThisYear(){const on=S.q.from===`${CUR}-01-01`&&!S.q.to;S.q.from=on?"":`${CUR}-01-01`;S.q.to="";S.qLimit=20;render()}
function qActive(){S.q.cat=S.q.cat==="主動式ETF"?"":"主動式ETF";S.qLimit=20;render()}
function qWindow(){const on=S.q.from===WIN_START&&S.q.to===META.aumAsOf;S.q.from=on?"":WIN_START;S.q.to=on?"":META.aumAsOf;S.qLimit=20;render()}
function goLookup(trust,bank){closeSheet();clearQ();S.q.trust=trust;S.q.bank=bank;go("lookup")}
function dlCSV(){
  const rows=[["基金統編","基金名稱","經理公司","保管銀行","分類","ETF分類","成立日","規模(新台幣元)","級別數"]].concat(filtered().map(f=>[f.id,f.full,f.trust,f.bankFull,f.cat,f.etf,f.date,Math.round(f.size*1e8),f.nc]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`基金保管查詢_${META.dataMonth.replace("/","")}.csv`;document.body.appendChild(a);a.click();a.remove()}

/* ========== 底部面板 ========== */
function openSheet(t,h){$("#stitle").textContent=t;$("#sbody").innerHTML=h;$("#sheet").scrollTop=0;$("#ov").classList.add("open");$("#sheet").classList.add("open")}
function closeSheet(){$("#ov").classList.remove("open");$("#sheet").classList.remove("open")}

const optList=(list,cur,fn,note)=>list.map(x=>`<button class="opt ${x===cur?"on":""}" onclick="${fn}('${esc(x)}')"><span>${html(x)} ${note?`<small>${note(x)}</small>`:""}</span></button>`).join("");

function openFilter(){
  const f=PAGES[S.page].filter;
  if(f==="q"){const q=S.q,cats=CATEGORY_ORDER.filter(c=>FUNDS.some(x=>x.cat===c));openSheet("篩選條件",`

    <div class="fld"><label>成立日（迄）</label><input type="date" id="f_to" value="${q.to}"></div></div>

    <div class="btns"><button class="bs" onclick="clearQ();closeSheet()">清除</button><button class="bp" onclick="applyQ()">查看結果</button></div>`)}
  else if(f==="hero")openSheet("選擇主角保管行",`<p class="msg">選定後，新案競爭力和其他頁面都會以這家銀行為比較基準並標示紅色（會記住你的選擇）。</p>`+optList(BANKNAMES,S.hero,"setHero",n=>"規模第 "+RANKA[n]+" 名"));
  else if(f==="rel"){if(S.relMode==="trust")openSheet("選擇投信",optList(TRUSTS,S.relTrust,"setRelT"));else openSheet("選擇保管行",optList(BANKNAMES,S.relBank,"setRelB"))}
}

   <div><span>保管檔數</span><b>${b.count} 檔</b>（第 ${RANKC[n]} 名）</div><div><span>投信客戶</span><b>${b.clients.size} 家</b></div>

   <h2 style="font-size:14px;margin-bottom:4px">前 5 大投信客戶（檔數）</h2>${hbars(topT.map(([k,v])=>({l:k,v:v.c})),v=>v+" 檔")}
   ${exp("產品類型分布",hbars(cats.map(([k,v])=>({l:k,v})),v=>v+" 檔"))}
   <button class="dl" onclick="goLookup('','${esc(n)}')">查看這家的基金明細 →</button>
   ${n!==S.hero?`<button class="dl" onclick="setHero('${esc(n)}')">設為主角保管行</button>`:""}`)}
function openFund(i){const f=FUNDS.find(x=>x.i===i);openSheet("基金資訊",`<h2 style="margin-bottom:8px">${html(f.name)}</h2>${f.full!==f.name?`<p class="fullname">${html(f.full)}</p>`:""}<div class="stat">
  <div><span>經理公司</span><b>${html(f.trust)}</b></div><div><span>保管行</span><b>${f.bank}</b></div>
  <div><span>產品類型</span><b>${f.cat}</b></div><div><span>ETF 分類</span><b>${f.etf}</b></div>
  <div><span>成立日</span><b>${f.date||"—"}</b></div><div><span>規模</span><b>${fmtA(f.size)}</b></div>
  <div><span>級別數</span><b>${f.nc}</b></div><div><span>基金統編</span><b>${f.id}</b></div></div>
  <button class="dl" onclick="openBank('${esc(f.bank)}')">看 ${f.bank} 概況 →</button>`)}

/* ========== 安裝提示 ========== */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(FUNDS&&S.page==="overview")render()});
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installBanner(){
  let dismissed=false;try{dismissed=localStorage.getItem("fcd_install_dismissed")==="1"}catch(e){}
  if(isStandalone()||dismissed)return "";
  if(deferredPrompt)return `<div class="install"><div><b>安裝到主畫面</b>像 app 一樣開啟，離線也能看最近一次資料</div><button onclick="doInstall()">安裝</button><button onclick="dismissInstall()" aria-label="關閉">✕</button></div>`;
  if(isIOS())return `<div class="install"><div><b>加入主畫面</b>點 Safari 下方的「分享」→「加入主畫面」，之後就能像 app 一樣開啟</div><button onclick="dismissInstall()" aria-label="關閉">✕</button></div>`;
  return "";
}
async function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()}
function dismissInstall(){try{localStorage.setItem("fcd_install_dismissed","1")}catch(e){}render()}

/* ========== 導覽 ========== */
function go(p){S.page=p;closeSheet();try{history.replaceState(null,"","#"+p)}catch(e){}render();window.scrollTo(0,0)}
function setS(k,v){S[k]=v;render()}
function toggleAll(id){S.showAll[id]=!S.showAll[id];render()}
function render(){
  const P=PAGES[S.page];
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===S.page));
  $("#ptitle").textContent=P.title;$("#psub").textContent=P.sub;
  $("#fbtn").style.visibility=P.filter?"visible":"hidden";
  $("#flabel").textContent=P.filter==="hero"?"主角行":P.filter==="rel"?"切換":"篩選";
  const n=P.filter==="q"?activeChips().length:0,bd=$("#fbadge");bd.hidden=!n;bd.textContent=n;
  $("#main").innerHTML=P.render()+`<div class="foot">資料來源：中華民國證券投資信託暨顧問商業同業公會（sitca.org.tw）公開資料，僅使用公開資料整理，不含保管費資訊。同一基金之不同級別僅計 1 檔；基金規模為新台幣（含外幣基金折合）。本頁為內部商機研判用途，非投資建議。<br><a href="../">開啟桌機完整版 →</a></div>`;
}

/* ========== 啟動 ========== */
fetch("../data.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init).catch(err=>{
  $("#ptitle").textContent="無法載入資料";
  $("#meta").textContent="請確認網路連線後重新整理";
  $("#main").innerHTML=`<div class="loading">讀取資料失敗（${html(err.message||err)}）。<br>連上網路後重新開啟即可；成功載入過一次後，離線也能看最近的資料。</div>`;
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
